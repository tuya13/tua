# Mijn idee voor mijn garden

Ik ben bijvoorbeeld van plan om een pagina te plaatsen die ik heb gemaakt van mijn junk journal. 
Daarop wil ik dan als eerste—als er een foto van mezelf is—vertellen wat ik aan het doen ben.
Daarna wil ik uitleggen waar ik de gebruikte materialen vandaan heb enzovoort, 
en waarom ik precies die kleuren heb gekozen. Tot slot wil ik beschrijven welk gevoel 
die pagina me geeft. 
Dat is in ieder geval wat ik nu in gedachten heb.
